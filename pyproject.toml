[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clio-cusp-8192-engine"
version = "4.0.0"
description = "CLIO-CUSP state estimation and Array-mRQMC kernel"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5.0",
  "timesfm[torch,xreg]==3.0.2",
  "transformers>=4.48.0",
  "safetensors>=0.5.3",
  "huggingface_hub>=0.28.0",
  "igraph>=0.11.6",
  "leidenalg>=0.10.2",
  "scipy>=1.14.1",
  "polars>=1.12.0",
  "numpy>=1.26.4",
]

[tool.setuptools]
py-modules = ["clio_cusp_8192_v4_kernel"]
